app = "youtube-transcript-tool"
primary_region = "sin"

[build]

[env]
  PORT = "7860"
  WHISPER_BACKEND = "groq"
  WHISPER_MODEL = "base"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
